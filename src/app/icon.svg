<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark Chassis -->
  <rect width="32" height="32" fill="#0D0D0D" rx="2"/>
  
  <!-- Corner Cuts -->
  <line x1="0" y1="6" x2="6" y2="0" stroke="#FF3B00" stroke-width="2"/>
  <line x1="26" y1="32" x2="32" y2="26" stroke="#CCFF00" stroke-width="2"/>
  
  <!-- Geometric 'O' -->
  <rect x="5" y="6" width="9" height="20" fill="none" stroke="#F4F1EA" stroke-width="2.5"/>
  <rect x="8.5" y="15" width="2" height="2" fill="#FF3B00"/>
  
  <!-- Geometric 'M' -->
  <line x1="18" y1="6" x2="18" y2="26" stroke="#F4F1EA" stroke-width="2.5"/>
  <line x1="26" y1="6" x2="26" y2="26" stroke="#F4F1EA" stroke-width="2.5"/>
  <polyline points="18,6 22,16 26,6" fill="none" stroke="#FF3B00" stroke-width="2.5"/>
  
  <!-- Signal Crosshair -->
  <circle cx="22" cy="16" r="1" fill="#CCFF00"/>
</svg>
